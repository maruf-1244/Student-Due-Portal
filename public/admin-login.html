<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Login</title>
    <style>
        body { font-family: Arial, sans-serif; background: #1a252f; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.2); text-align: center; width: 300px; }
        .login-card h2 { color: #2c3e50; }
        .login-card p.sub { color: #6c757d; font-size: 13px; margin-top: -8px; margin-bottom: 10px; }
        input[type="text"], input[type="password"] { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 10px; background: #2c3e50; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; }
        button:hover { background: #1a252f; }
        .back-link { display: block; margin-top: 14px; font-size: 13px; color: #6c757d; text-decoration: none; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>Admin Login</h2>
        <p class="sub">Authority access only</p>
        <form action="/admin-login" method="POST">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
        <a class="back-link" href="/">&larr; Student login</a>
    </div>
</body>
</html>
